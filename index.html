    <script>
      // In accordance with environment constraints ("HMR: Disabled. Ignore WebSocket errors."),
      // suppress benign ambient Vite HMR WebSocket connection closed errors in iframe preview.
      window.addEventListener('error', function(event) {
        var msg = event.message || (event.error && event.error.message) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          msg.includes('@vite/client') ||
          msg.includes('ws://') ||
          msg.includes('wss://')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? String(event.reason.message || event.reason.stack || event.reason) : '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('closed without opened') ||
          reason.includes('@vite/client') ||
          reason.includes('ws://') ||
          reason.includes('wss://')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      // Intercept window.WebSocket in iframe preview environment
      if (typeof window !== 'undefined' && window.WebSocket) {
        var NativeWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          try {
            var instance = new NativeWebSocket(url, protocols);
            instance.addEventListener('error', function(e) {
              if (e && typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation();
              }
            });
            return instance;
          } catch (e) {
            return {
              addEventListener: function() {},
              removeEventListener: function() {},
              send: function() {},
              close: function() {},
            };
          }
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        window.WebSocket.OPEN = NativeWebSocket.OPEN;
        window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
        window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
      }
    </script>
  </head>
