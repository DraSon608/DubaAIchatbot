    <meta property="og:description" content="An intelligent AI automation chatbot similar to ChatGPT that seamlessly works both offline and online with edge computing, local task automations, code execution, and cloud Gemini models." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tibetan:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      // In accordance with environment constraints ("HMR: Disabled. Ignore WebSocket errors."),
      // suppress benign ambient Vite HMR WebSocket connection closed errors in iframe preview.
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var first = args[0];
          var msg = (first && (first.message || first.stack || '' + first)) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('closed without opened') ||
            msg.includes('@vite/client')
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var first = args[0];
          var msg = (first && (first.message || first.stack || '' + first)) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('closed without opened') ||
            msg.includes('@vite/client')
          ) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('closed without opened') ||
            msg.includes('@vite/client') ||
            msg.includes('ws://') ||
            msg.includes('wss://')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? String(event.reason.message || event.reason.stack || event.reason) : '';
          if (
            reason.includes('WebSocket') ||
            reason.includes('closed without opened') ||
            reason.includes('@vite/client') ||
            reason.includes('ws://') ||
            reason.includes('wss://')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Safe mock for Vite HMR socket in iframe preview
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.includes('vite') || url.includes('/ws')))
            ) {
              var listeners = {};
              var dummy = {
                readyState: 1, // OPEN
                url: url,
                protocol: protocols || '',
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                send: function() {},
                close: function() {
                  dummy.readyState = 3; // CLOSED
                  if (listeners['close']) {
                    listeners['close'].forEach(function(fn) { fn({ wasClean: true }); });
                  }
                },
              };
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

  </body>
